<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Primary Title & SEO Meta Tags -->
    <title>JungleDex — Discover, Identify & Collect the Natural World</title>
    <meta
      name="description"
      content="Turn outdoor walks into real-world expeditions. Identify plants, wildlife, birds, and landscapes using AI, and mint holographic collector specimen cards in your personal field dex."
    />
    <meta
      name="keywords"
      content="nature scanner, wildlife identification, plant identifier, bird identifier, nature dex, outdoor expedition, biodiversity radar, pokemon go for nature, field notes, wildlife photography, specimen cards"
    />
    <meta name="author" content="JungleDex Team" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#10291e" />

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#10b981" />

    <!-- Mobile App & PWA Capabilities -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JungleDex" />

    <!-- Open Graph / Facebook / WhatsApp / Discord Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JungleDex" />
    <meta property="og:title" content="JungleDex — Turn the Great Outdoors into Your Personal Dex" />
    <meta
      property="og:description"
      content="Identify plants, wildlife, and natural phenomena in the wild. Snap photos to identify species and unlock holographic collectible specimen cards."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JungleDex Holographic Specimen Cards & Real-World Nature Discovery" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JungleDex — The Living World Dex" />
    <meta
      name="twitter:description"
      content="Snap photos of wildlife and landscapes to identify species, track expedition strides with live GPS, and collect holographic specimen cards."
    />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="JungleDex Nature Exploration & Collector Cards" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "JungleDex",
        "url": "https://jungledex-web.onrender.com",
        "description": "Turn outdoor walks into real-world expeditions. Identify plants, wildlife, birds, and landscapes using AI, and mint holographic collector specimen cards in your personal field dex.",
        "applicationCategory": "EducationalApplication, LifestyleApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "AI Nature & Wildlife Identification",
          "Holographic 3D Specimen Cards",
          "Local Biodiversity Radar",
          "Expedition Stride & GPS Telemetry",
          "Cloud Sync & Offline Support"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
