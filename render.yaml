services:
  # 1. Backend Web Service (Node.js Express API)
  - type: web
    name: jungledex-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: '*' # Or lock to your frontend domain e.g. https://jungledex-web.onrender.com
      - key: GOOGLE_MODEL
        value: gemini-3.5-flash
      - key: GOOGLE_API_KEY
        sync: false # Enter your Google AI Studio API key in Render dashboard

  # 2. Frontend Static Site (React 18 + Vite PWA)
  - type: web
    name: jungledex-web
    runtime: static
    buildCommand: npm install && npm run build -w client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://jungledex-api.onrender.com # Set to your deployed jungledex-api URL
      # Firebase Google Authentication & Cloud Firestore Variables:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
